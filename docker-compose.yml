version: "3.9"

services:
  ipocket:
    build: .
    ports:
      - "8000:8000"
    environment:
      IPAM_DB_PATH: /data/ipocket.db
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET before running Docker Compose}"
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD: admin-pass
    volumes:
      - ./data:/data
