replicaCount: 1

# Rolling upgrade strategy for the Deployment.
# maxSurge: 0 + maxUnavailable: 1: the old pod is terminated first so the
# ReadWriteOnce PVC is released, then the new pod is created and binds the
# claim. The inverse ordering (new pod first) deadlocks: the new pod waits on
# the PVC while the pod refuses to terminate until the new pod is Ready.
strategy:
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: ipocket
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

resources: {}

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  storageClassName: ""

sessionSecret: "change-me-in-production"

adminBootstrap:
  username: ""
  password: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ipocket.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
